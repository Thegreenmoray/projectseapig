# Sea Pig Configuration File (seapig.yaml or .seapig.yaml)

# Default number of test loops for `pig` when --loop is omitted
workers: 10

# Timeout per individual test execution (e.g. 5s, 30s, 1m,1h, etc). This is the maximum time a single test can run before being killed.
timeout: 10m

# Timeout for discovering tests in large projects
discovery_timeout: 10m

# Enable verbose internal debugging logs
debug: false

#replace these with whatever you need. this is a template, you must make your own. 